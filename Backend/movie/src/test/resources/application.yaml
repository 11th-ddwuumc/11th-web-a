spring:
  datasource:
    url: jdbc:h2:mem:umc_movie;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password: ''
  jpa:
    hibernate:
      # 테스트용 Spring 컨텍스트가 시작되고 종료될 때 스키마를 생성하고 삭제합니다.
      ddl-auto: create-drop
    open-in-view: false

jwt:
  secret: test-secret-for-context-loading-only
  access-expiration: 3600
