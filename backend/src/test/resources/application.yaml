spring:
  datasource:
    url: jdbc:h2:mem:umc_test;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    open-in-view: false

jwt:
  secret: "umc-test-secret-key-at-least-32-bytes-long"
  expiration: 3600000
