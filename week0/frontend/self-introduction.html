<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>자기소개</title>
    <style>
      .card {
        width: 90%;
        max-width: 560px;
        padding: 24px;
        border: 1px solid #e2e8f0;
        border-radius: 16px;
        margin: 16px auto;
        box-sizing: border-box;
      }

      h1 {
        color: blue;
      }

      p {
        color: gray;
      }

      .skills {
        display: flex;
        gap: 30px;
      }

      button {
        background: #2563eb;
        color: #ffffff;
      }

      button:hover {
        background: #1d4ed8;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <header>
        <h1>유호연</h1>
        <p>토끼와 거북이중 거북이</p>
      </header>
      <section>
        <h2>배우고 싶은 기술</h2>
        <ul class="skills">
          <li>자바</li>
          <li>스프링</li>
          <li>리액트</li>
        </ul>
      </section>

      <section>
        <h2>나의 링크</h2>
        <a href="https://github.com/yuho9">깃허브 방문하기</a>
      </section>

      <button type="button">인사하기</button>
    </main>
  </body>
</html>
